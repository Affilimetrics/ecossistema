<!doctype html><html lang="pt-br" data-bs-theme="dark"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ofertas</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-black text-light"><main class="container py-5">
<div class="d-flex justify-content-between mb-4"><h1>Ofertas</h1><a href="{% url 'dashboard' %}" class="btn btn-outline-light">Home</a></div>
<div class="card bg-dark border-secondary p-4 mb-4"><h2 class="h5">Gerar oferta</h2>
<form method="post">{% csrf_token %}<div class="input-group"><select name="produto_id" class="form-select">{% for p in produtos %}<option value="{{p.id}}">{{p.nome|default:"Produto"}} — {{p.preco_atual}}</option>{% endfor %}</select><button class="btn btn-success">Gerar</button></div></form></div>
<div class="row g-3">{% for o in ofertas %}<div class="col-lg-6"><div class="card bg-dark border-secondary p-4 h-100"><div class="d-flex justify-content-between"><strong>{{o.produto.nome|default:"Produto"}}</strong><span class="badge bg-success">{{o.status}}</span></div><pre class="mt-3 text-light" style="white-space:pre-wrap">{{o.mensagem}}</pre><div class="d-flex gap-2"><form method="post" action="{% url 'enviar_oferta' o.id %}">{% csrf_token %}<input type="hidden" name="canal" value="TELEGRAM"><button class="btn btn-primary btn-sm">Enviar Telegram</button></form></div></div></div>{% empty %}<p class="text-secondary">Nenhuma oferta criada.</p>{% endfor %}</div>
</main></body></html>
