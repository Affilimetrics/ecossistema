{% load static %}
<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Afillimetrics - Criar conta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root { --bg-dark:#0a0a0a; --card-bg:#1a1a1a; --brand-blue:#2B7AEC; --brand-green:#2ECC71; }
    body { background:var(--bg-dark); color:#fff; }
    .bg-card { background:var(--card-bg); border:1px solid #2d3748; }
    .btn-green { background:var(--brand-green); color:#fff; }
    .btn-green:hover { background:#27ae60; color:#fff; }
    .form-control:focus { border-color:var(--brand-green); box-shadow:0 0 0 .25rem rgba(46,204,113,.2); }
  </style>
<link rel="stylesheet" href="{% static 'core/ui-loader.css' %}">
</head>
<body class="min-vh-100 d-flex align-items-center justify-content-center p-3">
<div id="pageTransitionLoader"><div class="page-loader-ring"></div></div>
<main class="w-100" style="max-width:460px">
  <div class="text-center mb-4">
    <a href="{% url 'index' %}" class="text-decoration-none text-white fs-2 fw-bold">Afillimetrics</a>
    <p class="text-secondary mb-0">Crie sua conta para acessar o painel</p>
  </div>
  <div class="bg-card p-4 p-sm-5 rounded-4 shadow-lg">
    {% if messages %}{% for message in messages %}<div class="alert alert-{{ message.tags|default:'danger' }} py-2 small">{{ message }}</div>{% endfor %}{% endif %}
    <form method="post" novalidate>
      {% csrf_token %}
      <div class="mb-3">
        <label for="nome" class="form-label">Nome</label>
        <input type="text" name="nome" id="nome" class="form-control bg-dark border-secondary text-white" placeholder="Seu nome" value="{{ request.POST.nome }}" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" name="email" id="email" class="form-control bg-dark border-secondary text-white" placeholder="seu@email.com" value="{{ request.POST.email }}" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Senha</label>
        <input type="password" name="password" id="password" class="form-control bg-dark border-secondary text-white" minlength="8" required>
      </div>
      <div class="mb-4">
        <label for="password_confirm" class="form-label">Confirmar senha</label>
        <input type="password" name="password_confirm" id="password_confirm" class="form-control bg-dark border-secondary text-white" minlength="8" required>
      </div>
      <button type="submit" class="btn btn-green w-100 py-2 fw-bold rounded-3">Criar conta</button>
    </form>
    <div class="text-center mt-4 small">
      <span class="text-secondary">Já possui uma conta?</span>
      <a href="{% url 'login' %}" class="text-info text-decoration-none">Entrar</a>
    </div>
  </div>
  <div class="text-center mt-4"><a href="{% url 'index' %}" class="text-secondary text-decoration-none small">&larr; Voltar para home</a></div>
</main>
<script src="{% static 'core/ui-loader.js' %}"></script>
</body>
</html>
