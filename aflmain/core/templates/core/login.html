{% load static %}
<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Afillimetrics - Login</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root {
      --bg-dark: #0a0a0a;
      --card-bg: #1a1a1a;
      --brand-blue: #2B7AEC;
      --brand-blue-hover: #2563c7;
      --brand-green: #2ECC71;
    }
    body { background-color: var(--bg-dark); color: #fff; }
    .bg-card { background-color: var(--card-bg); border: 1px solid #2d3748; }
    .btn-blue { background-color: var(--brand-blue); color: #fff; }
    .btn-blue:hover { background-color: var(--brand-blue-hover); color: #fff; }
    .text-green { color: var(--brand-green); }
    .text-green:hover { color: #27ae60; }
    .text-blue { color: var(--brand-blue); }
    .form-control:focus {
      border-color: var(--brand-green);
      box-shadow: 0 0 0 0.25rem rgba(46, 204, 113, 0.2);
    }
  </style>
</head>
<body class="min-vh-100 d-flex align-items-center justify-content-center p-3">

  <main class="w-100" style="max-width: 420px;">
    <!-- Logo e Cabeçalho -->
    <div class="text-center mb-4">
      <a href="{% url 'index' %}" class="text-decoration-none text-white fs-2 fw-bold d-block">Afillimetrics</a>
      <p class="text-secondary mb-0">Entre na sua conta</p>
    </div>

    <!-- Card de Login -->
    <div class="bg-card p-4 p-sm-5 rounded-4 shadow-lg">
      <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        
        <!-- Mensagens de Erro/Alerta do Django -->
        {% if messages %}
          {% for message in messages %}
            <div class="alert alert-{{ message.tags }} py-2 small" role="alert">
              {{ message }}
            </div>
          {% endfor %}
        {% endif %}

        <!-- Campo E-mail -->
        <div class="mb-3">
          <label for="email" class="form-label small font-medium">E-mail</label>
          <input type="email" name="username" id="email" class="form-control bg-dark border-secondary text-white py-2" placeholder="seu@email.com" required>
        </div>

        <!-- Campo Senha -->
        <div class="mb-3">
          <label for="password" class="form-label small font-medium">Senha</label>
          <div class="input-group">
            <input type="password" name="password" id="password" class="form-control bg-dark border-secondary text-white py-2" placeholder="••••••••" required>
            <button class="btn btn-outline-secondary bg-dark text-secondary border-secondary border-start-0" type="button" id="togglePassword">
              <i class="bi bi-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <!-- Lembrar de mim -->
        <div class="form-check mb-4">
          <input class="form-check-input bg-dark border-secondary" type="checkbox" name="remember_me" id="remember">
          <label class="form-check-label text-secondary small cursor-pointer" for="remember">
            Lembrar de mim
          </label>
        </div>

        <!-- Botão Entrar -->
        <button type="submit" class="btn btn-blue w-100 py-2.5 fw-bold rounded-3 shadow-sm mb-3">
          Entrar
        </button>

        <!-- Esqueci minha senha -->
        <div class="text-center mb-4">
          <a href="{% url 'index' %}" class="text-green text-decoration-none small">
            Esqueci minha senha
          </a>
        </div>

        <!-- Divisor -->
        <div class="position-relative text-center my-4">
          <hr class="border-secondary m-0">
          <span class="position-absolute top-50 start-50 translate-middle px-3 bg-card text-secondary small">ou</span>
        </div>

        <!-- Login com Google -->
        <a href="#" class="btn btn-outline-secondary text-white w-100 py-2.5 rounded-3 d-flex align-items-center justify-content-center gap-2 mb-4">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Entrar com Google
        </a>

        <!-- Link Criar conta -->
        <div class="text-center small">
          <span class="text-secondary">Não tem uma conta? </span>
          <a href="{% url 'index' %}" class="text-blue text-decoration-none fw-medium">
            Criar conta
          </a>
        </div>
      </form>
    </div>

    <!-- Link Voltar -->
    <div class="text-center mt-4">
      <a href="{% url 'index' %}" class="text-secondary text-decoration-none small hover-white">
        &larr; Voltar para home
      </a>
    </div>
  </main>

  <!-- Script para alternar visibilidade da senha -->
  <script>
    const togglePassword = document.querySelector('#togglePassword');
    const password = document.querySelector('#password');
    const eyeIcon = document.querySelector('#eyeIcon');

    togglePassword.addEventListener('click', function () {
      const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
      password.setAttribute('type', type);
      
      eyeIcon.classList.toggle('bi-eye');
      eyeIcon.classList.toggle('bi-eye-slash');
    });
  </script>
</body>
</html>
