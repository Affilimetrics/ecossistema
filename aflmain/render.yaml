services:
  - type: web
    name: afillimetrics
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn aflmain.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: TIME_ZONE
        value: America/Sao_Paulo
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_REDIRECT_URI
        sync: false
      - key: META_API_VERSION
        value: v25.0
      - key: META_SCOPES
        value: ads_read,business_management,pages_show_list,pages_read_engagement,instagram_basic
      - key: META_APPSECRET_PROOF
        value: "True"
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
